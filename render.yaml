services:
  - type: web
    name: ministerio-metanoia
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/popular_curriculo_teologico.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
