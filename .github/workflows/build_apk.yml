name: Compilar APK Android // Ministério Metanoia

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet CLI e Dependências
        run: |
          pip install --upgrade pip
          pip install flet

      - name: Gerar APK (Para Instalação Direta no Celular)
        run: |
          flet build apk --project "metanoia" --org "com.metanoia.ministerio" --product "Metanoia"

      - name: Gerar AAB (Para Publicação na Google Play Store)
        run: |
          flet build aab --project "metanoia" --org "com.metanoia.ministerio" --product "Metanoia"

      - name: Salvar Artefatos (APK e AAB)
        uses: actions/upload-artifact@v4
        with:
          name: metanoia-android-builds
          path: |
            build/apk/*.apk
            build/aab/*.aab

